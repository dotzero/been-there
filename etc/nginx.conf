server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # React Router / SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Долгое кеширование для Vite assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html всегда проверяем на обновления
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
